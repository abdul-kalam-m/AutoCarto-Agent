name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        # -c constraints-ci.txt pins the native numeric stack to the
        # verified-good versions; without it, pip resolves bleeding-edge
        # scipy/numpy that segfault on the Linux runner (see the file's
        # header comment). Kept CI-only so the library stays flexible.
        run: pip install -e .[dev] -c constraints-ci.txt
      - name: Run tests
        run: pytest
      - name: Demo smoke run (determinism harness)
        run: python -m autocarto.demo --out ci_demo_out
