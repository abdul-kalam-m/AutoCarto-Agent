name: Web workspace
on:
  push:
    paths: ['web/**', 'src/autocarto/**', 'tests/test_phase2.py', 'tests/test_beta.py', 'tests/test_web.py', 'tests/test_workspace.py', 'tests/test_snapshot_nj_web.py', 'scripts/snapshot_nj_tracts.py', 'scripts/snapshot_nj_web.py', 'pyproject.toml', 'constraints-ci.txt', 'constraints-web-linux.txt', 'compose.beta.yml', 'render.yaml', 'Dockerfile.web', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'src/autocarto/**', 'tests/test_phase2.py', 'tests/test_beta.py', 'tests/test_web.py', 'tests/test_workspace.py', 'tests/test_snapshot_nj_web.py', 'scripts/snapshot_nj_tracts.py', 'scripts/snapshot_nj_web.py', 'pyproject.toml', 'constraints-ci.txt', 'constraints-web-linux.txt', 'compose.beta.yml', 'render.yaml', 'Dockerfile.web', '.github/workflows/web.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -c constraints-ci.txt -c constraints-web-linux.txt -e '.[web,geo]' pytest
      - run: python -m pytest tests/test_phase2.py tests/test_beta.py tests/test_web.py tests/test_workspace.py tests/test_snapshot_nj_web.py tests/gates/test_gate1.py tests/gates/test_gate2.py tests/gates/test_gate4.py tests/gates/test_gate5.py tests/gates/test_gate6.py tests/test_contracts.py
      - run: npm ci && npm run build
        working-directory: web
      - run: docker build -f Dockerfile.web -t cartollm-web:ci .
      - name: Exercise Phase 2 inside the 512 MiB runtime
        run: |
          docker run --rm -i --network none --memory 512m --memory-swap 512m -e AUTOCARTO_OFFLINE=1 cartollm-web:ci python - <<'PY'
          import resource
          from autocarto.web.engine import catalog, _plan
          from autocarto.web.spatial import ProximityRequest, proximity, map_geometry_checks
          catalog()
          for metric in ('density', 'population', 'income'):
              result = _plan(metric, 'forest', 'auto', 'tracts')
              assert result['validation']['classification']['passed']
              assert result['validation']['color']['passed']
          map_geometry_checks('counties')
          map_geometry_checks('tracts')
          result = proximity(ProximityRequest(distance_m=500))
          assert result['applied']
          assert len(result['buffers']['features']) == 394
          assert len(result['record']['matched_tract_ids']) == 790
          print('Phase 2 container smoke passed; peak RSS MiB:', resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024)
          PY
