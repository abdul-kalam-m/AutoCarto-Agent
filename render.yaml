# One instance; automatic scaling and paid preview environments are disabled.
# $7 web + $6 PostgreSQL compute. Storage/bandwidth are billed separately.
services:
  - type: web
    name: cartollm-beta
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Dockerfile.web
    numInstances: 1
    healthCheckPath: /api/health
    preDeployCommand: python -m autocarto.web.admin migrate
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cartollm-beta-db
          property: connectionString
      - key: AUTOCARTO_DEPLOYMENT
        value: production
      - key: AUTOCARTO_AUTH_REQUIRED
        value: "1"
      - key: AUTOCARTO_AI_DAILY_LIMIT
        value: "20"
      - key: AUTOCARTO_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
databases:
  - name: cartollm-beta-db
    plan: 0.1c-256mb
    region: virginia
    databaseName: cartollm
    user: cartollm
    postgresMajorVersion: "16"
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
