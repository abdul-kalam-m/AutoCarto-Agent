[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocarto-agent"
version = "0.1.0"
description = "Neuro-symbolic architecture for autonomous thematic cartography with deterministic spatial validation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abdul Kalam Mustaq", email = "ar.abdulkalam.mustaq@gmail.com" }]
keywords = ["cartography", "GIS", "LLM", "neuro-symbolic", "spatial-statistics", "autonomous-GIS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jenkspy>=0.3",
    "pyproj>=3.5",
    "colorspacious>=1.1",
]

[project.optional-dependencies]
retrieval = ["qdrant-client>=1.8"]
embeddings = ["sentence-transformers>=3.0"]
geo = ["geopandas>=0.14", "libpysal>=4.9"]
dev = ["pytest>=8", "esda>=2.5"]

[project.scripts]
autocarto = "autocarto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
