[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocarto-agent"
version = "0.1.0"
description = "Neuro-symbolic architecture for autonomous thematic cartography with deterministic spatial validation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abdul Kalam Mustaq", email = "ar.abdulkalam.mustaq@gmail.com" }]
keywords = ["cartography", "GIS", "LLM", "neuro-symbolic", "spatial-statistics", "autonomous-GIS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jenkspy>=0.3",
    "pyproj>=3.5",
    "colorspacious>=1.1",
]

[project.optional-dependencies]
retrieval = ["qdrant-client>=1.8"]
embeddings = ["sentence-transformers>=3.0"]
geo = ["geopandas>=0.14", "libpysal>=4.9"]
dev = ["pytest>=8", "esda>=2.5"]
# The one gap between ALLOWED_IMPORTS (execution/sandbox.py) and the rest of
# the dependency graph: cartopy is whitelisted for sandboxed code to import
# but nothing else in this project needs it (TD-6 removed it from
# environment.yml as unused). Kept as its own extra, installed only in the
# sandbox image, so the whitelist and what the image can actually run stay
# reconciled without adding cartopy to every other install.
sandbox = ["cartopy>=0.22"]

[project.scripts]
autocarto = "autocarto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# setuptools only includes .py files by default; the five curated
# stylesheets (P1-T7) are runtime data resolve_style() reads by path, not
# imported as code, so they need to be listed explicitly or a real (non
# -e) wheel install silently ships without them -- found while building
# the sandbox image (Phase 5), which is the first non-editable install
# this project has ever actually run.
"autocarto.styles" = ["*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
