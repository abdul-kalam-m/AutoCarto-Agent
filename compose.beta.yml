# Local beta acceptance environment. Password comes from your environment.
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: cartollm
      POSTGRES_USER: cartollm
      POSTGRES_PASSWORD: ${BETA_DB_PASSWORD:?Set BETA_DB_PASSWORD}
    volumes:
      - beta-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cartollm -d cartollm"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: cartollm-web:beta
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: postgresql+psycopg://cartollm:${BETA_DB_PASSWORD}@db/cartollm
    command: [python, -m, autocarto.web.admin, migrate]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: cartollm-web:beta
    ports: ["127.0.0.1:8001:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cartollm:${BETA_DB_PASSWORD}@db/cartollm
      AUTOCARTO_AUTH_REQUIRED: "1"
      AUTOCARTO_PUBLIC_URL: http://127.0.0.1:8001
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
volumes:
  beta-db:
